[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sequence-reclab"
version = "0.0.0"
description = "Controlled experiments on the predictive value of chronological order in recommendation."
requires-python = ">=3.11"

[project.optional-dependencies]
dev = ["pytest>=8,<9"]
deep = ["torch>=2.2,<3", "numpy>=2,<3"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["src"]

[tool.setuptools.packages.find]
where = ["src"]
